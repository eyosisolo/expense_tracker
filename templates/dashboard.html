<!DOCTYPE html>
<html lang="en">

 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

 </head>

 <body>

  <div class="container">

    <h1>Expense Tracker Dashboard</h1>

    <p>Welcome!</p>
    <a href="/add_expense" class="button">Add Expense</a>
    
    <h2>Total Expenses: {{ total }}</h2>

    <h3>Expense List</h3>

    <table border="1">

    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Amount</th>
      <th>Category</th>
    </tr>

    {% for expense in expenses %}

   <tr>

<td>{{ expense["id"] }}</td>

<td>{{ expense["title"] }}</td>

<td>{{ expense["amount"] }}</td>

<td>{{ expense["category"] }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/add_expense" class="button">
Add Expense
</a>
  </div>

 </body>

 </html>
