<!DOCTYPE html>
<html lang="en">

 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

 </head>
 <body>
    <div class="container">
        <form method="POST">
            <h2>Login</h2>
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Enter your username" title="Username" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Enter your password" title="Password" required>

            <button type="submit">Login</button>
        </form>
    </div>
 </body>
</html>
