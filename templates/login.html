<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
          <a href="{{ url_for('home') }}" class="back-button">
            ← Back to Home
        </a>
</head>

<body>

    <div class="form-container">

        <h1>Login</h1>

        <form method="POST">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit" class="button">
                Login
            </button>

        </form>

        
        <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </div>

</body>

</html>
