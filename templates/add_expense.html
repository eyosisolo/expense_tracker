<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense - Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="form-container">

        <h1>Add Expense</h1>

        <form method="POST">

            <label for="title">
                Expense Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Food"
                required
            >

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="e.g. 250.00"
                step="0.01"
                min="0"
                required
            >

            <label for="category">
                Category
            </label>

            <input
                type="text"
                id="category"
                name="category"
                placeholder="e.g. Food, Transport, Bills"
                required
            >

            <button type="submit" class="button">
                Save Expense
            </button>

        </form>

        <a href="{{ url_for('dashboard') }}" class="back-button">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
